buildscript {
    ext.kotlin_version = rootProject.ext.has('kotlin_version') ? rootProject.ext.kotlin_version : '2.1.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def webappDir = file("${project.projectDir}/../webapp")
def portalsBuildDir = file("${webappDir}/build-portals")
def fedCapBuildDir = file("${webappDir}/build-fedcap")
def assetsDir = file("${project.projectDir}/src/main/assets")

android {
    namespace "io.ionic.liveupdateprovidermock"
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'com.capacitorjs:core:8.3.0'

    implementation 'io.ionic:liveupdateprovider:0.1.0-alpha.2'
}

tasks.register("bundleMockAssets") {
    group = "build setup"
    description = "Copies webapp build outputs into Android assets."

    inputs.dir(portalsBuildDir)
    inputs.dir(fedCapBuildDir)
    outputs.dir(assetsDir)

    doLast {
        if (!portalsBuildDir.exists()) {
            throw new GradleException("Portals build not found: ${portalsBuildDir}. Run: cd webapp && npm run build:portals")
        }
        if (!fedCapBuildDir.exists()) {
            throw new GradleException("FedCap build not found: ${fedCapBuildDir}. Run: cd webapp && npm run build:fedcap")
        }

        delete(assetsDir)

        copy {
            from(portalsBuildDir)
            into(file("${assetsDir}/portals"))
        }

        copy {
            from(fedCapBuildDir)
            into(file("${assetsDir}/federated-capacitor"))
        }
    }
}

tasks.named("preBuild") {
    dependsOn(tasks.named("bundleMockAssets"))
}
